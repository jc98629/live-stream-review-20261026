case 'script-rewrite':{if(!v(root,'script-rewrite-note'))return error(root,'script-editor-error','请填写本轮修改意见。');if(ck(root,'script-lock')&&v(root,'script-rewrite-scope')==='开场段')return error(root,'script-editor-error','修改范围与锁定开场冲突，请调整范围或主动取消锁定。');const latest=v(root,'script-editor'),opening=v(root,'script-rewrite-scope')==='开场段',paragraphs=latest.split(/\n\s*\n/),index=paragraphs.findIndex(p=>p.includes(opening?'【口播】':'【动作】'));if(index<0)return error(root,'script-editor-error','未找到所选范围对应的段落，请先补充【口播】或【动作】标签。');state.scriptDiffOld=paragraphs[index];state.scriptDiffNew=opening?'【口播】先从你今天会遇到的使用场景讲起，再一起看这款演示商品的已确认功能。':'【动作】先展示标准版外观，再按操作说明逐步演示；每完成一步，停顿并说明当前动作。';if(state.scriptDiffOld===state.scriptDiffNew)return error(root,'script-editor-error','当前示例与所选段落相同，没有新增差异；可先人工编辑再演示改稿。');paragraphs[index]=state.scriptDiffNew;state.scriptText=paragraphs.join('\n\n');state.scriptChanged=true;state.scriptVersion++;state.scriptChecked=false;state.scriptAvailable=false;renderOne('script-editor');toast('已按当前人工稿载入固定改稿示例，展示实际段落差异；未调用真实模型。');break;}

document.addEventListener('input',e=>{if(e.target.dataset.localSearch){const root=activeRoot(e.target),q=e.target.value.trim().toLowerCase();$$('tbody tr',root).forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))}if(e.target.id==='report-editor'){if(state.reportState!=='草稿'){state.reportVersion++;state.reportSendState='未发送'}state.reportText=e.target.value;state.reportState='草稿';const reportRoot=activeRoot(e.target);['report-data-check','report-note-check'].forEach(id=>{const box=$('#'+id,reportRoot);if(box)box.checked=false});const sendBadge=$$('.page-head .tag',reportRoot)[1];if(sendBadge){sendBadge.textContent='未发送';sendBadge.className='tag amber'}const badge=$('.page-head .tag',reportRoot);if(badge){badge.textContent='草稿';badge.className='tag purple'}}if(e.target.id==='script-editor'){state.scriptText=e.target.value;state.scriptChecked=false;state.scriptAvailable=false;const badge=$('.page-head .tag',activeRoot(e.target));if(badge){badge.textContent='待运营审稿';badge.className='tag purple'}}});
