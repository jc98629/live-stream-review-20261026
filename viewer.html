<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>直播中台｜大屏原型评审</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#18182a;color:#eeedf8}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;flex-wrap:wrap;border-bottom:1px solid #35334f}a{color:#ded7ff;text-decoration:none}header strong{font-size:16px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#2a2942;border:1px solid #4a4564;border-radius:7px;padding:7px 11px;cursor:pointer}select{max-width:330px}option{background:#2a2942}#stage{position:relative;overflow:auto;height:calc(100dvh - 76px);padding:20px;overscroll-behavior:contain}#canvas{position:relative;margin:auto}iframe{position:absolute;left:0;top:0;width:1440px;height:960px;border:0;background:#f6f7fb;transform-origin:0 0;box-shadow:0 10px 50px #0004}#scale{min-width:48px;text-align:center}button:hover{background:#3b355d}@media(max-width:760px){header{padding:10px 12px}.controls{width:100%}select{flex:1;max-width:100%;min-width:0}.controls .optional{display:none}#stage{height:calc(100dvh - 124px);padding:10px}}</style></head><body>
<header><a href="./index.html">← 评审首页</a><strong>直播中台 · 原型评审</strong><div class="controls"><select id="page" aria-label="选择原型页面"><option value="login">01 · 登录与项目权限</option><option value="home">02 · 工作台首页</option><option value="projects">03 · 项目与业务对象</option><option value="access">04 · 成员与项目权限</option><option value="sources">05 · 来源与已有工具</option><option value="coverage">06 · 24项数据覆盖清单</option><option value="import">07 · 导入与字段对应</option><option value="import-review">08 · 导入校验与提交</option><option value="materials">09 · 资料与成果目录</option><option value="material-detail">10 · 资料详情与引用</option><option value="tasks">11 · 任务列表</option><option value="task-detail">12 · 任务详情与异常处理</option><option value="hourly">13 · 多项目小时数据</option><option value="daily">14 · 日数据与周期资料</option><option value="data-detail">15 · 数据详情与更正</option><option value="daily-report">16 · 日报草稿与确认</option><option value="script-setup">17 · 创建话术任务</option><option value="script-facts">18 · 资料读取与事实确认</option><option value="script-editor">19 · 审稿与受控修改</option><option value="script-confirm">20 · 试读、定稿与交付</option><option value="cases">21 · 案例知识库与检索</option><option value="case-detail">22 · 案例详情与方案参考</option><option value="video-input">23 · 提供素材与改写要求</option><option value="video-result">24 · 素材拆解与文案对照</option><option value="schedule-input">25 · 可播时间与排班条件</option><option value="schedule-result">26 · 排班草案与人工确认</option></select><button id="minus" aria-label="缩小">−</button><span id="scale">适配</span><button id="plus" aria-label="放大">＋</button><button id="fit">适配</button><button id="actual" class="optional">100%</button><a id="open" href="./prototype.html#home" target="_blank" rel="noopener">独立打开 ↗</a></div></header>
<main id="stage"><div id="canvas"><iframe id="frame" title="直播中台可点击交互原型" src="./prototype.html#home"></iframe></div></main><script>
const ids=["login", "home", "projects", "access", "sources", "coverage", "import", "import-review", "materials", "material-detail", "tasks", "task-detail", "hourly", "daily", "data-detail", "daily-report", "script-setup", "script-facts", "script-editor", "script-confirm", "cases", "case-detail", "video-input", "video-result", "schedule-input", "schedule-result"];const stage=document.querySelector('#stage'),canvas=document.querySelector('#canvas'),frame=document.querySelector('#frame'),select=document.querySelector('#page');let zoom=1,autoFit=true;
function pageId(){const h=decodeURIComponent(location.hash.slice(1)).replace(/^preview=/,'');return ids.includes(h)?h:'home'}
function applyZoom(){frame.style.transform='scale('+zoom+')';canvas.style.width=(1440*zoom)+'px';canvas.style.height=(960*zoom)+'px';document.querySelector('#scale').textContent=Math.round(zoom*100)+'%'}
function fit(){autoFit=true;zoom=Math.max(.15,Math.min((stage.clientWidth-40)/1440,(stage.clientHeight-40)/960,1.5));applyZoom()}
function setZoom(z){autoFit=false;zoom=Math.max(.15,Math.min(z,2));applyZoom()}
function route(){const id=pageId();select.value=id;document.querySelector('#open').href='./prototype.html#'+id;if(frame.getAttribute('src')!=='./prototype.html#'+id)frame.src='./prototype.html#'+id;document.title='直播中台｜'+select.selectedOptions[0].textContent}
select.addEventListener('change',()=>{location.hash='preview='+select.value});document.querySelector('#minus').onclick=()=>setZoom(zoom-.1);document.querySelector('#plus').onclick=()=>setZoom(zoom+.1);document.querySelector('#fit').onclick=fit;document.querySelector('#actual').onclick=()=>setZoom(1);window.addEventListener('hashchange',route);window.addEventListener('resize',()=>{if(autoFit)fit()});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='page-changed'||!ids.includes(e.data.page))return;history.replaceState(null,'','#preview='+e.data.page);select.value=e.data.page;document.title='直播中台｜'+select.selectedOptions[0].textContent;document.querySelector('#open').href='./prototype.html#'+e.data.page});route();fit();
</script></body></html>
