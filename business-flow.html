function overlap(a,b,pad=0){return a.x-pad<b.x+b.w&&a.x+a.w+pad>b.x&&a.y-pad<b.y+b.h&&a.y+a.h+pad>b.y}
function segmentHits(a,b,r,pad=.5){if(a.x===b.x){return a.x>r.x-pad&&a.x<r.x+r.w+pad&&Math.max(Math.min(a.y,b.y),r.y-pad)<Math.min(Math.max(a.y,b.y),r.y+r.h+pad)}return a.y>r.y-pad&&a.y<r.y+r.h+pad&&Math.max(Math.min(a.x,b.x),r.x-pad)<Math.min(Math.max(a.x,b.x),r.x+r.w+pad)}
function auditOne(data){const g=data.geometry,errors=[];for(const a of g.labels){for(const b of g.nodes)if(overlap(a,b))errors.push('标签压节点：'+a.id+' / '+b.id);for(const b of g.labels)if(a.id<b.id&&overlap(a,b))errors.push('标签重叠：'+a.id+' / '+b.id)}for(const b of [...g.nodes,...g.labels])if(b.x<0||b.y<0||b.x+b.w>g.width||b.y+b.h>g.height)errors.push('画布越界：'+b.id);for(const e of g.edges){for(let i=1;i<e.points.length;i++){const a=e.points[i-1],b=e.points[i];if(a.x!==b.x&&a.y!==b.y)errors.push('非直角连线：'+e.id);if(Math.min(a.x,b.x)<0||Math.min(a.y,b.y)<0||Math.max(a.x,b.x)>g.width||Math.max(a.y,b.y)>g.height)errors.push('连线越界：'+e.id);for(const n of g.nodes)if(n.id!==e.from&&n.id!==e.to&&segmentHits(a,b,n))errors.push('连线穿节点：'+e.id+' / '+n.id);for(const l of g.labels)if(l.id!==e.id&&segmentHits(a,b,l))errors.push('连线穿标签：'+e.id+' / '+l.id)}}return{id:g.id,ok:!errors.length,errors:[...new Set(errors)],nodeCount:g.nodes.length,labelCount:g.labels.length,edgeCount:g.edges.length}}
function auditGeometry(){const charts=CANVASES.map(d=>{draw(d);return auditOne(d)});const errors=charts.flatMap(c=>c.errors.map(e=>c.id+'：'+e));const result={ok:!errors.length,errors,charts};document.querySelector('.audit-chip').textContent=result.ok?'布局检查通过 · 全部画布':'布局待修正 · '+errors.length+' 项';window.DIAGRAM_GEOMETRY=CANVASES.map(d=>d.geometry);return result}window.auditGeometry=auditGeometry;
// 本地服务会在整元素截图前调用本入口。解除滚动裁切并隐藏阅读控件，按真实尺寸输出。
function prepareServiceExport(){document.body.classList.add('export-mode');setZoom(1,false);viewport.scrollLeft=0;viewport.scrollTop=0;window.scrollTo(0,0);return auditGeometry()}
window.PMDiagram={audit:prepareServiceExport};
function setZoom(value,manual=true){zoom=Math.min(1.5,Math.max(.12,value));userZoom=manual;CANVASES.forEach(d=>{d.element.style.transform='scale('+zoom+')';d.shell.style.width=(d.width*zoom)+'px';d.shell.style.height=(d.height*zoom)+'px'});document.querySelector('.zoom-value').textContent=Math.round(zoom*100)+'%'}
function fit(){const c=CANVASES[activeCanvas];setZoom(Math.min(1,(viewport.clientWidth-65)/c.width),false)}
function focusCanvas(index){activeCanvas=index;document.querySelectorAll('.tabs button').forEach((b,i)=>b.setAttribute('aria-selected',i===index?'true':'false'));if(!userZoom)fit();CANVASES[index].shell.scrollIntoView({behavior:'smooth',block:'start'})}
window.focusCanvas=focusCanvas;window.setZoom=setZoom;window.fitDiagram=fit;
function locateHashCanvas(){const wanted=decodeURIComponent(location.hash.slice(1));const index=CANVASES.findIndex(c=>c.id===wanted);if(index<0)return;activeCanvas=index;document.querySelectorAll('.tabs button').forEach((b,i)=>b.setAttribute('aria-selected',i===index?'true':'false'));if(!userZoom)fit();CANVASES[index].shell.scrollIntoView({behavior:'auto',block:'start'})}
window.addEventListener('hashchange',locateHashCanvas);
CANVASES.forEach(renderCanvas);window.PAGES=CANVASES.map(d=>({id:d.id,label:d.title,selector:'#'+d.id}));setZoom(1,false);fit();requestAnimationFrame(locateHashCanvas);auditGeometry();window.addEventListener('resize',()=>{if(!userZoom)fit();auditGeometry()});
let drag=null;viewport.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,a'))return;drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!drag)return;viewport.scrollLeft=drag.left-(e.clientX-drag.x);viewport.scrollTop=drag.top-(e.clientY-drag.y)});function stopDrag(){drag=null;viewport.classList.remove('dragging')}viewport.addEventListener('pointerup',stopDrag);viewport.addEventListener('pointercancel',stopDrag);
function exportGuard(e){if(!e.target.closest('.export-btn'))return;const result=auditGeometry();if(!result.ok){e.preventDefault();e.stopImmediatePropagation();alert('布局检查未通过：\n'+result.errors.join('\n'));return}/* 服务在独立页面按原尺寸截图；当前阅读缩放保持不变。 */}document.addEventListener('click',exportGuard,true);
function exportDiagram(){const file='business-flow.png';const a=document.createElement('a');a.href='./'+file;a.download=file;a.click();}window.exportDiagram=exportDiagram;window.addEventListener('message',e=>{if(e.data==='export-success'||e.data==='export-error'){document.body.classList.remove('export-mode');if(embedded)fit()}});setTimeout(auditGeometry,300);
</script></body></html>
