function renderCanvas(data){const shell=el('section',{class:'canvas-shell','data-chart':data.id});const c=el('div',{class:'chart-container screenflow-canvas',id:data.id});c.style.width=data.width+'px';c.style.height=data.height+'px';shell.append(c);const heading=el('header',{class:'canvas-heading audit-box',id:data.id+'-heading'});const h=el('h2');h.textContent=data.title;const p=el('p');p.textContent=data.subtitle;heading.append(h,p);c.append(heading);for(const node of data.nodes){const div=el('div',{id:data.id+'-'+node.id,class:'flow-node '+node.kind,'data-node':node.id});Object.assign(div.style,{left:node.x+'px',top:node.y+'px',width:node.w+'px',height:node.h+'px'});if(node.page){const frame=el('div',{class:'node-frame'}),iframe=el('iframe',{'data-pw':'1440','data-ph':'960',title:node.title,loading:'eager',tabindex:'-1',src:PROTOTYPE+'#'+node.page});iframe.style.width='1440px';iframe.style.height='960px';iframe.style.transform='scale('+(320/1440)+')';frame.append(iframe);const label=el('div',{class:'node-label'});label.textContent=node.title;const sub=el('small');sub.textContent=node.body;label.append(sub);div.append(frame,label)}else{const card=el('div',{class:'flow-card'}),strong=el('strong');strong.textContent=node.title;card.append(strong);if(node.body){const text=el('p');text.textContent=node.body;card.append(text)}div.append(card)}c.append(div)}const svg=svgEl('svg',{class:'screenflow-svg',viewBox:'0 0 '+data.width+' '+data.height,width:data.width,height:data.height});const defs=svgEl('defs');const marker=svgEl('marker',{id:data.id+'-arrow',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'});marker.append(svgEl('path',{d:'M 1 1 L 9 5 L 1 9 Z',fill:'#8d82b1'}));defs.append(marker);svg.append(defs);c.append(svg);document.querySelector('.chart-stack').append(shell);data.element=c;data.shell=shell;draw(data)}
function bounds(node,c){const r=node.getBoundingClientRect(),cr=c.getBoundingClientRect(),s=cr.width/c.offsetWidth;return{x:(r.left-cr.left)/s-c.clientLeft,y:(r.top-cr.top)/s-c.clientTop,w:r.width/s,h:r.height/s}}

function route(a,b,e,ar,br){const fs=e.fromSide||'right',ts=e.toSide||'left',bend=e.bend||80;let pts=[a];if(e.route==='hub'){const x=a.x+bend;pts.push({x,y:a.y},{x,y:b.y})}else if(e.route==='failure-to-issue'){const y=Math.max(ar.y+ar.h,br.y+br.h)+bend,x=br.x+br.w+120;pts.push({x:a.x,y},{x,y},{x,y:b.y})}else if(fs===ts){if(fs==='top'||fs==='bottom'){const y=fs==='top'?Math.min(a.y,b.y)-bend:Math.max(a.y,b.y)+bend;pts.push({x:a.x,y},{x:b.x,y})}else{const x=fs==='left'?Math.min(a.x,b.x)-bend:Math.max(a.x,b.x)+bend;pts.push({x,y:a.y},{x,y:b.y})}}else if((fs==='left'||fs==='right')&&(ts==='left'||ts==='right')){if(Math.abs(a.y-b.y)>.1){const x=(a.x+b.x)/2;pts.push({x,y:a.y},{x,y:b.y})}}else if((fs==='top'||fs==='bottom')&&(ts==='top'||ts==='bottom')){if(Math.abs(a.x-b.x)>.1){const y=(a.y+b.y)/2;pts.push({x:a.x,y},{x:b.x,y})}}else if(fs==='left'||fs==='right'){pts.push({x:b.x,y:a.y})}else{pts.push({x:a.x,y:b.y})}pts.push(b);return pts.filter((p,i)=>!i||p.x!==pts[i-1].x||p.y!==pts[i-1].y)}

function overlap(a,b,pad=0){return a.x-pad<b.x+b.w&&a.x+a.w+pad>b.x&&a.y-pad<b.y+b.h&&a.y+a.h+pad>b.y}
function segmentHits(a,b,r,pad=.5){if(a.x===b.x){return a.x>r.x-pad&&a.x<r.x+r.w+pad&&Math.max(Math.min(a.y,b.y),r.y-pad)<Math.min(Math.max(a.y,b.y),r.y+r.h+pad)}return a.y>r.y-pad&&a.y<r.y+r.h+pad&&Math.max(Math.min(a.x,b.x),r.x-pad)<Math.min(Math.max(a.x,b.x),r.x+r.w+pad)}
function auditOne(data){const g=data.geometry,errors=[];for(const a of g.labels){for(const b of g.nodes)if(overlap(a,b))errors.push('标签压节点：'+a.id+' / '+b.id);for(const b of g.labels)if(a.id<b.id&&overlap(a,b))errors.push('标签重叠：'+a.id+' / '+b.id)}for(const b of [...g.nodes,...g.labels])if(b.x<0||b.y<0||b.x+b.w>g.width||b.y+b.h>g.height)errors.push('画布越界：'+b.id);for(const e of g.edges){for(let i=1;i<e.points.length;i++){const a=e.points[i-1],b=e.points[i];if(a.x!==b.x&&a.y!==b.y)errors.push('非直角连线：'+e.id);if(Math.min(a.x,b.x)<0||Math.min(a.y,b.y)<0||Math.max(a.x,b.x)>g.width||Math.max(a.y,b.y)>g.height)errors.push('连线越界：'+e.id);for(const n of g.nodes)if(n.id!==e.from&&n.id!==e.to&&segmentHits(a,b,n))errors.push('连线穿节点：'+e.id+' / '+n.id);for(const l of g.labels)if(l.id!==e.id&&segmentHits(a,b,l))errors.push('连线穿标签：'+e.id+' / '+l.id)}}return{id:g.id,ok:!errors.length,errors:[...new Set(errors)],nodeCount:g.nodes.length,labelCount:g.labels.length,edgeCount:g.edges.length}}
